<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="LLM Council: scientists around a round table with a chairman">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11141d"/>
      <stop offset="1" stop-color="#1f2750"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <!-- round table -->
  <g transform="translate(240 160)">
    <circle r="92" fill="#232a3d" stroke="#3b4668" stroke-width="3"/>
    <!-- chairman -->
    <circle cx="0" cy="-122" r="26" fill="#1a1f2d" stroke="#f2c230" stroke-width="5"/>
    <text x="0" y="-122" font-size="26" text-anchor="middle" dominant-baseline="central">⚖️</text>
    <!-- members -->
    <g fill="#1a1f2d" stroke="#7c93ff" stroke-width="4">
      <circle cx="116" cy="-38" r="22"/>
      <circle cx="72" cy="99" r="22"/>
      <circle cx="-72" cy="99" r="22"/>
      <circle cx="-116" cy="-38" r="22"/>
    </g>
    <g font-size="22" text-anchor="middle" dominant-baseline="central">
      <text x="116" y="-38">🧑‍🔬</text>
      <text x="72" y="99">🧑‍🔬</text>
      <text x="-72" y="99">🧑‍🔬</text>
      <text x="-116" y="-38">🧑‍🔬</text>
    </g>
  </g>
  <text x="470" y="150" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="#e7eaf3">LLM Council</text>
  <text x="472" y="198" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#9aa3b8">Many models sit at the table. They rank each other.</text>
  <text x="472" y="236" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#9aa3b8">The chairman delivers the verdict.</text>
</svg>
